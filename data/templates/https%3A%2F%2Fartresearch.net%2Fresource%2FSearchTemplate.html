        text-match-help='<b>Traditional Keyword Search.</b> Finds records containing your exact search terms. <semantic-link iri="https://artresearch.net/resource/search-help" fragment="text-match" target="_blank">See search documentation</semantic-link>'
        text-similarity-help='<b>Conceptual Search.</b> Finds records that are thematically related to your search terms, searching across all information and languages. <semantic-link iri="https://artresearch.net/resource/search-help" fragment="textual-similarity" target="_blank">See search documentation</semantic-link>'
        text-visual-match-help='<b>Visual Concept Search.</b> Finds artworks that visually represent the concept of your search terms, even abstract terms or color in black-and-white photos. <semantic-link iri="https://artresearch.net/resource/search-help" fragment="visual-similarity-from-text" target="_blank">See search documentation</semantic-link>'
        visual-match-help='<b>Near-Exact Copies.</b> Near-Exact Copies. Finds duplicates, prints, copies or different versions of your uploaded image. <semantic-link iri="https://artresearch.net/resource/search-help" fragment="visual-match" target="_blank">See search documentation</semantic-link>'
        visual-similarity-help='<b>Aesthetic Search.</b> Finds artworks with a similar style, mood, or subject matter to your uploaded image. <semantic-link iri="https://artresearch.net/resource/search-help" fragment="visual-similarity-from-image" target="_blank">See search documentation</semantic-link>'

                 "withImages": true,
                 "domainColor": "#E8756F",
                 "withTextualSimilarity": false,

                SELECT ?subject WHERE {
                  # a page that embeds the search restricts it (the works of an artist, of a place) with a
                  # pattern of its own; as a subquery QLever plans it alone, from what the page fixes, instead
                  # of following the restriction from every work towards it
                  ?subject crm:P2_has_type <http://vocab.getty.edu/aat/300133025> .
                  {{#if searchRestrictions}}{ SELECT DISTINCT ?subject WHERE { {{searchRestrictions}} } }{{/if}}
                }
              ' text-query-0='
                SELECT DISTINCT ?subject WHERE {
                  {
                      SELECT ?subject (?__textScorePattern__ AS ?score) WHERE {
                        FILTER(?__textPattern__)
                        ?subject crm:P2_has_type <http://vocab.getty.edu/aat/300133025> .
                        {{#if searchRestrictions}}{ SELECT DISTINCT ?subject WHERE { {{searchRestrictions}} } }{{/if}}
                      }
                      GROUP BY ?subject
                  }
                }
              ' text-with-ai-query-0='
                PREFIX vec: <https://qlever.cs.uni-freiburg.de/vectorSearch/>
                PREFIX rank: <https://qlever.cs.uni-freiburg.de/rank/>
                PREFIX math: <http://www.w3.org/2005/xpath-functions/math#>
                PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
                SELECT DISTINCT ?subject WHERE {
                  {
                    SELECT ?subject ?score ?maxPhoto ?matchType WHERE {
                      # each kind of search scores 0 to 1 (its weakest to its strongest match); keyword and conceptual
                      # read the same catalogue text, so they count as one, the stronger plus half the other; so do the
                      # two visual ones; text and look add up, and a work photographed often (prominent: the
                      # archives photographed it again and again) weighs up to half more: 6.934 = ln(1 + 1026), the most
                      # photographs a work has (2026-10-20)
                      {
                        SELECT ?subject
                               (MAX(IF(?matchedModel = "text_index", ?norm, 0)) AS ?keyword)
                               (MAX(IF(?matchedModel = "narratives", ?norm, 0)) AS ?conceptual)
                               (MAX(IF(?matchedModel = "images", ?norm, 0)) AS ?visual)
                               (MAX(IF(?matchedModel = "dinov3", ?norm, 0)) AS ?copies)
                               (MAX(?photo) AS ?maxPhoto) (GROUP_CONCAT(?matchedModel ; separator=",") AS ?matchType) WHERE {
                          FILTER(?__vectorPattern__)
                        }
                        GROUP BY ?subject
                      }
                      OPTIONAL { { SELECT ?subject (COUNT(?prominencePhoto) AS ?photographs) WHERE { ?subject custom:photo ?prominencePhoto . } GROUP BY ?subject } }
                      BIND(IF(?keyword > ?conceptual, ?keyword + 0.5 * ?conceptual, ?conceptual + 0.5 * ?keyword) AS ?text)
                      BIND(IF(?visual > ?copies, ?visual + 0.5 * ?copies, ?copies + 0.5 * ?visual) AS ?look)
                      BIND((?text + ?look) * (1 + 0.5 * math:log(1 + COALESCE(?photographs, 0)) / 6.934) AS ?score)
                    }
                  }
                }

              },
              "<https://artresearch.net/custom/number_of_matched_artworks>": {
                "kind": "numeric-range",
                "valuesQuery": "SELECT ?numericRangeBeginValue ?numericRangeEndValue WHERE { ?subject <https://artresearch.net/custom/number_of_matched_artworks> ?value . BIND(?value as ?numericRangeBeginValue). BIND(?value as ?numericRangeEndValue) . }"
              }
--]]
            }'>
