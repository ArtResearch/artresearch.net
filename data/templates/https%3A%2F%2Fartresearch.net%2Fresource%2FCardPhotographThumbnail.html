  [[!--
    A photograph in the results as a print on the table, on its mount with its archive's mark, and
    its title beneath. Picking it up opens the record. (search-room.css)
  --]]
  <figure class="print-mount">
    {{#if data}}
      <semantic-link-container uri="{{data.[@id]}}" target="_blank">
        <div class="print-place" title="Open record: {{data.label}}">
          {{#if data.[https://artresearch.net/resource/field_definition/pharos_model/photo_thumbnail]}}
            <span class="print-on-mount">
              <img class="print-picture" loading="lazy" alt="" src="https://artresearch.net{{data.[https://artresearch.net/resource/field_definition/pharos_model/photo_thumbnail].values.0.[@value]}}" />
              <img class="print-mark" alt="" title="{{data.[https://artresearch.net/resource/field_definition/pharos_model/photo_provider].values.0.label}}" src="{{data.[https://artresearch.net/resource/field_definition/pharos_model/photo_provider].values.0.[https://artresearch.net/resource/field_definition/pharos_model/provider_icon].values.0.[@value]}}" />
            </span>
          {{else}}
            <span class="print-blank">No image</span>
          {{/if}}
        </div>
      </semantic-link-container>
      <figcaption class="print-caption"><semantic-link iri="{{data.[@id]}}" target="_blank">{{data.label}}</semantic-link></figcaption>
    {{/if}}
  </figure>
