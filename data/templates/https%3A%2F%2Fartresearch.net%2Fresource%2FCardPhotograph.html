[[!--
  A photograph in the results, as a slip: the print on its mount with its archive's mark, its title
  and what its card says, its archive's mark, and one key that opens its record. (search-room.css)
--]]
<article class="slip">
  <resource-info subject="{{subject.value}}" profile="photograph-card" template="{{> template}}">
    <template id="template">
      <semantic-link-container uri="{{subject}}" target="_blank">
        <div class="slip-print" title="Open record">
          {{#if data.[https://artresearch.net/resource/field_definition/pharos_model/photo_thumbnail]}}
            <span class="print-on-mount">
              <img class="print-picture" loading="lazy" alt="" src="https://artresearch.net{{data.[https://artresearch.net/resource/field_definition/pharos_model/photo_thumbnail].values.0.[@value]}}" />
              <img class="print-mark" alt="" title="{{data.[https://artresearch.net/resource/field_definition/pharos_model/photo_provider].values.0.label}}" src="{{data.[https://artresearch.net/resource/field_definition/pharos_model/photo_provider].values.0.[https://artresearch.net/resource/field_definition/pharos_model/provider_icon].values.0.[@value]}}" />
            </span>
          {{else}}
            <span class="print-blank">No image</span>
          {{/if}}
        </div>
      </semantic-link-container>

      <div class="slip-body">
        <h3 class="slip-title">
          <semantic-link iri="{{subject}}" target="_blank">
            {{#if data.[https://artresearch.net/resource/field_definition/pharos_model/photo_title].values.[0]}}
              {{data.[https://artresearch.net/resource/field_definition/pharos_model/photo_title].values.[0].[label]}}
            {{else}}
              {{data.[https://artresearch.net/resource/field_definition/pharos_model/photo_artwork].values.[0].[label]}}
            {{/if}}
          </semantic-link>
        </h3>
        <dl class="slip-rows">
          {{> row data=data field="https://artresearch.net/resource/field_definition/pharos_model/photographer"}}
          {{> row data=data field="https://artresearch.net/resource/field_definition/pharos_model/production_date"}}
          {{> row data=data field="https://artresearch.net/resource/field_definition/pharos_model/photo_artwork"}}
        </dl>
        {{#if matchType.value}}
          <p class="slip-why">
            <span class="slip-why-lead">Found by</span>
            {{#each (split matchType.value ',')}}
              {{#ifCond this '===' 'text_index'}}
                <mp-popover>
                  <mp-popover-trigger placement="bottom" trigger='["hover"]'><span class="slip-why-term">text match</span></mp-popover-trigger>
                  <mp-popover-content>This record is shown because its information contains your exact search terms.</mp-popover-content>
                </mp-popover>
              {{/ifCond}}
              {{#ifCond this '===' 'narratives'}}
                <mp-popover>
                  <mp-popover-trigger placement="bottom" trigger='["hover"]'><span class="slip-why-term">textual similarity</span></mp-popover-trigger>
                  <mp-popover-content>This record is shown because its descriptive text is conceptually similar to your search terms.</mp-popover-content>
                </mp-popover>
              {{/ifCond}}
              {{#ifCond this '===' 'images'}}
                <mp-popover>
                  <mp-popover-trigger placement="bottom" trigger='["hover"]'><span class="slip-why-term">visual similarity</span></mp-popover-trigger>
                  <mp-popover-content>This artwork is shown because it shares a similar aesthetic (style, mood, or composition) to your search terms.</mp-popover-content>
                </mp-popover>
              {{/ifCond}}
              {{#ifCond this '===' 'dinov3'}}
                <mp-popover>
                  <mp-popover-trigger placement="bottom" trigger='["hover"]'><span class="slip-why-term">visual match</span></mp-popover-trigger>
                  <mp-popover-content>This image is a near-exact copy of the one you provided.</mp-popover-content>
                </mp-popover>
              {{/ifCond}}
            {{/each}}
          </p>
        {{/if}}
      </div>

      <div class="slip-side">
        <span class="slip-register" title="{{data.[https://artresearch.net/resource/field_definition/pharos_model/photo_provider].label}}">
          {{#each data.[https://artresearch.net/resource/field_definition/pharos_model/photo_provider].values}}
            <img class="mark" alt="" title="{{label}}" src="{{[https://artresearch.net/resource/field_definition/pharos_model/provider_icon].values.0.[@value]}}">
          {{/each}}
        </span>
        <semantic-link class="open-key" iri="{{subject}}" target="_blank">Open record</semantic-link>
      </div>
    </template>
    <template id="row">
      {{#if (lookup data field)}}
        <div class="slip-row">
          <dt>{{lookup (lookup data field) 'label'}}</dt>
          <dd>
            {{#each (lookup (lookup data field) 'values')}}
              {{#if [@id]}}
                <semantic-link target="_blank" iri="{{[@id]}}">{{label}}</semantic-link>
              {{else if (eq ../field "https://artresearch.net/resource/field_definition/pharos_model/production_date")}}
                {{dateRangeFormat [@value]}}
              {{else}}
                {{[@value]}}
              {{/if}}
              {{#unless @last}}<span class="sep">·</span>{{/unless}}
            {{/each}}
          </dd>
        </div>
      {{/if}}
    </template>
  </resource-info>
</article>
