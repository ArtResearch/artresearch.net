<resource-info subject="[[this]]" profile="artwork-full" template="{{> template}}">

  <!-- ═══════════════════════════════════════════════════════════════
       PHAROS record page: the reading room.
       Implements platform-design/pharos-record-design-alive.md. The
       bench on the left is the real pharos-auto-fit-grid; the record
       sheet on the right reads every field through one pattern — the
       reconciled claim, the archives' marks, and what each archive
       wrote in a slip beneath. Styles: assets/new-styles/reading-room.css.
       The sheet reads itself through :has() from the grid's own
       data-archive state: what none of the chosen archives attests fades
       back and nothing moves. The per-archive rules are written below,
       because they depend on which archives stand behind this record.
       ═══════════════════════════════════════════════════════════════ -->
  <template id="template">
    <mp-event-trigger id="breadcrumbs" type='Component.TemplateUpdate' on='["mounted"]'
      targets='["top-header-breadcrumbs"]' data='{"breadcrumb": "Work: {{escapeForJson data.label}}"}'>
    </mp-event-trigger>

    <div class="rr">
      <style>
        {{#each (recordArchives data)}}
        {{#if icon}}.rr [data-archive="{{{key}}}"] { --mark: url("{{{icon}}}"); }{{/if}}
        {{/each}}
        .rr .sheet :is([data-arch], .part, .group) { {{#each (recordArchives data)}}--on-{{{key}}}: initial; {{/each}} }
        .rr:has(.AutoFitGrid--autoFitGrid[data-archive]) .sheet :is([data-arch]:not(.scale-row), .scale-row > *, .part > h2, .group > h3) { opacity: {{{onChain (recordArchives data) "var(--faded)"}}}; }
        .rr:has(.AutoFitGrid--autoFitGrid[data-archive]) .sheet .mark { opacity: 0.16; }
        {{#each (recordArchives data)}}
        .rr:has(.AutoFitGrid--autoFitGrid[data-archive~="{{{key}}}"]) .sheet :is([data-arch~="{{{key}}}"], .part:has([data-arch~="{{{key}}}"]), .group:has([data-arch~="{{{key}}}"])) { --on-{{{key}}}: 1; }
        .rr:has(.AutoFitGrid--autoFitGrid[data-archive~="{{{key}}}"]) .sheet .mark[data-archive="{{{key}}}"] { opacity: 0.82; }
        .rr:has(.AutoFitGrid--autoFitGrid[data-archive~="{{{key}}}"]) .through .who[data-archive="{{{key}}}"] { display: inline-flex; }
        {{/each}}
      </style>

      <div class="desk">

        <!-- ═════════ the bench: rail above, table below ═════════ -->
        <section class="bench">
          <pharos-auto-fit-grid class="table" layout-algo="justified"
            tabs='[{"key":"photos","label":"Photographs"}[[#if (ask "ASK { { ?? custom:relatedArtwork ?relatedRecord . } UNION { ?ownRecord custom:objectSameAs ?? . ?ownRecord custom:relatedArtwork ?relatedRecord . } OPTIONAL { ?relatedRecord custom:objectSameAs ?relatedCluster . ?relatedCluster crm:P2_has_type <http://vocab.getty.edu/aat/300133025> . } BIND(COALESCE(?relatedCluster, ?relatedRecord) AS ?related) FILTER(?related != ??) ?related crm:P2_has_type <http://vocab.getty.edu/aat/300133025> . }")]],{"key":"related","label":"Related works"}[[/if]],{"key":"similar","label":"Similar works"}]'
            images='{{photoImages data.[https://artresearch.net/resource/field_definition/pharos_model/photo].values
                      base="https://artresearch.net" workLabel=data.label}}'
            record-card='{"profile": "artwork-card",
              "fields": ["https://artresearch.net/resource/field_definition/pharos_model/creator", "https://artresearch.net/resource/field_definition/pharos_model/production_date", "https://artresearch.net/resource/field_definition/pharos_model/current_keeper",
                         "https://artresearch.net/resource/field_definition/pharos_model/part_of_builtwork", "https://artresearch.net/resource/field_definition/pharos_model/location"],
              "archives": "https://artresearch.net/resource/field_definition/pharos_model/original_record_catalog", "archiveIcon": "https://artresearch.net/resource/field_definition/pharos_model/provider_icon"}'>

            <!--
              The work's parts (crm:P46, at any depth) on the photographs' table, under the work's own
              prints: each part with a photograph as its preferred one, under the part of the work it
              belongs to (?part) and, further in, the part of that part (?within; the part itself when
              there is none). A part reached two ways takes one of them whole. A part without a
              photograph is left to the sheet's tree. Heading: the field label of object_has_parts.
              Whether there are parts is asked on the server; a work may have thousands.
            -->
            [[#if (ask "ASK { ?? crm:P46_is_composed_of ?part }")]]
            <div data-contents data-label="Has Parts" data-batch="120"
              data-empty="No photographs of this work or its parts have been shared yet." data-query='
              SELECT ?subject ?part ?partPage ?within ?withinPage ?image ?iiif ?width ?height ?archive ?provider ?logo WHERE {
                {
                  SELECT ?subject ?path (SAMPLE(?previewUrl) AS ?preview) (SAMPLE(?manifest) AS ?iiif)
                         (SAMPLE(?imageWidth) AS ?width) (SAMPLE(?imageHeight) AS ?height) (MAX(?key) AS ?archive) WHERE {
                    {
                      SELECT ?subject (MIN(?way) AS ?path) (MIN(?preferred) AS ?photo) WHERE {
                        { <{{subject}}> crm:P46_is_composed_of ?subject . BIND(?subject AS ?p1) }
                        UNION { <{{subject}}> crm:P46_is_composed_of ?p1 . ?p1 crm:P46_is_composed_of ?subject . BIND(?subject AS ?p2) }
                        UNION { <{{subject}}> crm:P46_is_composed_of ?p1 . ?p1 crm:P46_is_composed_of ?p2 . ?p2 crm:P46_is_composed_of+ ?subject . }
                        FILTER(?subject != <{{subject}}>)
                        ?subject custom:preferred_photo ?preferred .
                        BIND(CONCAT(STR(?p1), " ", COALESCE(STR(?p2), "")) AS ?way)
                      }
                      GROUP BY ?subject
                    }
                    ?photo custom:primary_image ?shown .
                    ?shown custom:preview_url ?previewUrl .
                    OPTIONAL { ?shown custom:iiif_url ?manifest }
                    OPTIONAL { ?shown custom:image_width ?imageWidth }
                    OPTIONAL { ?shown custom:image_height ?imageHeight }
                    OPTIONAL { ?photo crm:P70i_is_documented_in ?catalogue }
                    BIND(IF(STRSTARTS(STR(?catalogue), "https://artresearch.net/resource/e31/"), STRAFTER(STR(?catalogue), "/e31/"), ?none) AS ?key)
                  }
                  GROUP BY ?subject ?path
                }
                # never leave ?within unbound: the OPTIONAL below would then join every work
                BIND(IRI(STRBEFORE(?path, " ")) AS ?part)
                BIND(IF(STRAFTER(?path, " ") = "", ?part, IRI(STRAFTER(?path, " "))) AS ?within)
                OPTIONAL { ?part crm:P2_has_type <http://vocab.getty.edu/aat/300133025> . BIND(true AS ?partPage) }
                OPTIONAL { ?within crm:P2_has_type <http://vocab.getty.edu/aat/300133025> . BIND(true AS ?withinPage) }
                BIND(IF(STRSTARTS(?preview, "http"), ?preview, CONCAT("https://artresearch.net", ?preview)) AS ?image)
                BIND(IRI(CONCAT("https://artresearch.net/resource/provider/", ?archive)) AS ?provider)
                BIND(CONCAT("/assets/images/minilogo_", ?archive, ".png") AS ?logo)
              }'></div>
            [[/if]]

            <!--
              Works the archives relate to this one (custom:relatedArtwork), laid on the table
              like the photographs. Records merged into this work hold most of the links, and a
              link may point to a record that was itself merged into another work, so both ends
              are resolved through custom:objectSameAs. Works linked from more of this work's
              records come first; each lies on the table as its preferred photograph.
            -->
            <div data-tab="related" data-empty="No related works." data-query='
              PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
              SELECT ?subject ?image ?iiif ?width ?height ?archive ?provider ?logo ?note WHERE {
                {
                  SELECT ?subject ?links ?photo
                         (SAMPLE(?previewUrl) AS ?preview) (SAMPLE(?manifest) AS ?iiif)
                         (SAMPLE(?imageWidth) AS ?width) (SAMPLE(?imageHeight) AS ?height)
                         (MAX(?key) AS ?archive) WHERE {
                    {
                      SELECT ?subject ?links (COALESCE(MIN(?preferred), ?subject) AS ?photo) WHERE {
                        {
                          SELECT ?subject (COUNT(DISTINCT ?source) AS ?links) WHERE {
                            { <{{subject}}> custom:relatedArtwork ?relatedRecord . BIND(<{{subject}}> AS ?source) }
                            UNION
                            { ?source custom:objectSameAs <{{subject}}> . ?source custom:relatedArtwork ?relatedRecord . }
                            OPTIONAL {
                              ?relatedRecord custom:objectSameAs ?relatedCluster .
                              ?relatedCluster crm:P2_has_type <http://vocab.getty.edu/aat/300133025> .
                            }
                            BIND(COALESCE(?relatedCluster, ?relatedRecord) AS ?subject)
                            FILTER(?subject != <{{subject}}>)
                            ?subject crm:P2_has_type <http://vocab.getty.edu/aat/300133025> .
                          }
                          GROUP BY ?subject
                        }
                        OPTIONAL { ?subject custom:preferred_photo ?preferred }
                      }
                      GROUP BY ?subject ?links
                    }
                    # the photograph shows its primary image: its picture, size and deep zoom, and the archive.
                    # A work with no photograph stands for itself: an unbound ?photo would join every image
                    OPTIONAL {
                      ?photo custom:primary_image ?shown .
                      ?shown custom:preview_url ?previewUrl .
                      OPTIONAL { ?shown custom:iiif_url ?manifest }
                      OPTIONAL { ?shown custom:image_width ?imageWidth }
                      OPTIONAL { ?shown custom:image_height ?imageHeight }
                    }
                    OPTIONAL { ?photo crm:P70i_is_documented_in ?catalogue }
                    BIND(IF(STRSTARTS(STR(?catalogue), "https://artresearch.net/resource/e31/"), STRAFTER(STR(?catalogue), "/e31/"), ?none) AS ?key)
                  }
                  GROUP BY ?subject ?links ?photo
                }
                # as the photographs tab shows it: the cached picture, the provider and its mark
                BIND(IF(STRSTARTS(?preview, "http"), ?preview, CONCAT("https://artresearch.net", ?preview)) AS ?image)
                BIND(IRI(CONCAT("https://artresearch.net/resource/provider/", ?archive)) AS ?provider)
                BIND(CONCAT("/assets/images/minilogo_", ?archive, ".png") AS ?logo)
                BIND(CONCAT("linked from ", STR(?links), IF(?links = 1, " record", " records")) AS ?note)
              }
              ORDER BY DESC(?links) ?subject
            '></div>

            <!--
              Works similar to this one, from the QLever vector indices: each of its photographs
              against the images index (visual-conceptual, SigLIP 2), each of its catalogue records
              against the narratives index (conceptual text). Each index ranks the works it finds
              and a work scores the sum of 1 / (60 + rank). A work found through several of its
              photographs lies on the table as the closest one; one found only through its text,
              as its preferred photograph. Related works are left to their own tab.
            -->
            <div data-tab="similar" data-empty="No similar works were found." data-query='
              PREFIX vec: <https://qlever.cs.uni-freiburg.de/vectorSearch/>
              PREFIX rank: <https://qlever.cs.uni-freiburg.de/rank/>
              PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
              SELECT ?subject ?image ?iiif ?width ?height ?archive ?provider ?logo ?note WHERE {
                {
                  SELECT ?subject ?score ?note ?photo
                         (SAMPLE(?previewUrl) AS ?preview) (SAMPLE(?manifest) AS ?iiif)
                         (SAMPLE(?imageWidth) AS ?width) (SAMPLE(?imageHeight) AS ?height)
                         (MAX(?key) AS ?archive) WHERE {
                    {
                      SELECT ?subject ?score ?note (COALESCE(SAMPLE(?closest), MIN(?preferred), ?subject) AS ?photo) WHERE {
                        {
                          SELECT ?subject (SUM(1.0 / (60 + ?rank)) AS ?score) (MAX(?closestPhoto) AS ?closest)
                                 (GROUP_CONCAT(?matchedModel ; separator=" · ") AS ?note) WHERE {
                            {
                              SERVICE rank: {
                                _:images rank:score ?similarity ; rank:descending true ; rank:limit 1000 ; rank:bindRank ?rank .
                                {
                                  SELECT ?subject (MAX(1 - ?distance) AS ?similarity)
                                         (IRI(STRAFTER(MIN(CONCAT(STR(xsd:integer(?distance * 1000000) + 10000000), " ", STR(?hitPhoto))), " ")) AS ?closestPhoto) WHERE {
                                    # at most 40 photographs of the work look for neighbours, its preferred ones first and
                                    # then a spread of the rest: each is a vector search of its own, and a work known by 731
                                    # photographs (A27113) took 16 s for much the same works as these find in 1 s
                                    {
                                      SELECT ?own WHERE {
                                        <{{subject}}> custom:photo ?own .
                                        OPTIONAL { <{{subject}}> custom:preferred_photo ?own . BIND(true AS ?ownPreferred) }
                                      } ORDER BY DESC(BOUND(?ownPreferred)) MD5(STR(?own)) LIMIT 40
                                    }
                                    SERVICE vec: {
                                      [] vec:index "images" ; vec:fullPrecision true ; vec:candidates ?own ;
                                         vec:result ?hitPhoto ; vec:bindScore ?distance ; vec:k 30 .
                                    }
                                    ?subject custom:photo ?hitPhoto .
                                    FILTER(?subject != <{{subject}}>)
                                    ?subject crm:P2_has_type <http://vocab.getty.edu/aat/300133025> .
                                  }
                                  GROUP BY ?subject
                                }
                              }
                              BIND("visual similarity" AS ?matchedModel)
                            } UNION {
                              SERVICE rank: {
                                _:narratives rank:score ?similarity ; rank:descending true ; rank:limit 1000 ; rank:bindRank ?rank .
                                {
                                  SELECT ?subject (MAX(1 - ?distance) AS ?similarity) WHERE {
                                    { ?own custom:objectSameAs <{{subject}}> } UNION { BIND(<{{subject}}> AS ?own) }
                                    SERVICE vec: {
                                      [] vec:index "narratives" ; vec:fullPrecision true ; vec:candidates ?own ;
                                         vec:result ?hit ; vec:bindScore ?distance ; vec:k 30 .
                                    }
                                    OPTIONAL {
                                      ?hit custom:objectSameAs ?reconciled .
                                      ?reconciled crm:P2_has_type <http://vocab.getty.edu/aat/300133025> .
                                    }
                                    BIND(COALESCE(?reconciled, ?hit) AS ?subject)
                                    FILTER(?subject != <{{subject}}>)
                                    ?subject crm:P2_has_type <http://vocab.getty.edu/aat/300133025> .
                                  }
                                  GROUP BY ?subject
                                }
                              }
                              BIND("textual similarity" AS ?matchedModel)
                            }
                            # related works have their own tab, resolved as there
                            MINUS {
                              { <{{subject}}> custom:relatedArtwork ?relatedRecord . }
                              UNION
                              { ?ownRecord custom:objectSameAs <{{subject}}> . ?ownRecord custom:relatedArtwork ?relatedRecord . }
                              OPTIONAL {
                                ?relatedRecord custom:objectSameAs ?relatedCluster .
                                ?relatedCluster crm:P2_has_type <http://vocab.getty.edu/aat/300133025> .
                              }
                              BIND(COALESCE(?relatedCluster, ?relatedRecord) AS ?subject)
                            }
                          }
                          GROUP BY ?subject
                          ORDER BY DESC(?score) DESC(?subject)
                          LIMIT 1000
                        }
                        OPTIONAL { ?subject custom:preferred_photo ?preferred }
                      }
                      GROUP BY ?subject ?score ?note
                    }
                    # the photograph shows its primary image: its picture, size and deep zoom, and the archive.
                    # A work with no photograph stands for itself: an unbound ?photo would join every image
                    OPTIONAL {
                      ?photo custom:primary_image ?shown .
                      ?shown custom:preview_url ?previewUrl .
                      OPTIONAL { ?shown custom:iiif_url ?manifest }
                      OPTIONAL { ?shown custom:image_width ?imageWidth }
                      OPTIONAL { ?shown custom:image_height ?imageHeight }
                    }
                    OPTIONAL { ?photo crm:P70i_is_documented_in ?catalogue }
                    BIND(IF(STRSTARTS(STR(?catalogue), "https://artresearch.net/resource/e31/"), STRAFTER(STR(?catalogue), "/e31/"), ?none) AS ?key)
                  }
                  GROUP BY ?subject ?score ?note ?photo
                }
                # as the photographs tab shows it: the cached picture, the provider and its mark
                BIND(IF(STRSTARTS(?preview, "http"), ?preview, CONCAT("https://artresearch.net", ?preview)) AS ?image)
                BIND(IRI(CONCAT("https://artresearch.net/resource/provider/", ?archive)) AS ?provider)
                BIND(CONCAT("/assets/images/minilogo_", ?archive, ".png") AS ?logo)
              }
              ORDER BY DESC(?score) DESC(?subject)
            '></div>
          </pharos-auto-fit-grid>
          {{#ifCond (photoImages data.[https://artresearch.net/resource/field_definition/pharos_model/photo].values) "==" "[]"}}
          [[#unless (ask "ASK { ?? crm:P46_is_composed_of ?part }")]]
          <div class="table-empty">No photographs of this work have been shared yet.</div>
          [[/unless]]
          {{/ifCond}}
          <div class="bench-note">
            <span class="for-photos"><b>Pick up</b> a print to read the record through its archive.</span>
            <span class="for-photos"><b>Select archives</b> to keep only their prints on the table.</span>
            <span class="for-works"><b>Pick up</b> a work to see it under the light.</span>
            <span class="for-works"><b>Lay out</b> the mounts to read what each record says.</span>
          </div>
        </section>

        <!-- ═════════ the record sheet ═════════ -->
        <section class="record">
          <div class="sheet">
            <div class="through"><span class="through-lead">Read through</span><span class="who who--all">every archive</span>
              {{#each (recordArchives data)}}
              <span class="who" data-archive="{{key}}">{{> mark archive=this}}{{label}}</span>
              {{/each}}
            </div>

            <header class="head">
              <h1>{{data.label}}</h1>
              {{#if (hasNoFields data)}}
              <p class="empty">No catalogue metadata has been reconciled for this record yet.</p>
              {{else}}
              {{#with (gloss data)}}<p class="gloss">{{> gloss data=../data}}</p>{{/with}}
              <div class="imprint">
                {{#with (recordArchives data)}}
                {{countWord this}} catalogue record{{#ifCond this.length ">" 1}}s{{/ifCond}}
                <span class="marks">{{> marks providers=this}}</span>
                {{/with}}
              </div>
              {{/if}}
            </header>

            {{> titlePart data=data}}
            {{> attributionPart data=data}}
            {{> datePart data=data}}
            {{> locationPart data=data}}
            <!-- Is Part Of/Has Part: where the record stands among wholes and parts. The headings are the
                 field labels of object_part_of_hierarchy, object_is_part_of and object_has_parts. -->
            <pharos-part-tree iri="{{subject}}" label="Is Part Of/Has Part" part-of-label="Is Part Of" parts-label="Has Parts"></pharos-part-tree>
            {{> subjectPart data=data}}
            {{> physicalPart data=data}}

            {{> plainPart data=data label="Culture"
                field="https://artresearch.net/resource/field_definition/pharos_model/culture"}}
            {{> plainPart data=data label="Style/Period"
                field="https://artresearch.net/resource/field_definition/pharos_model/style_period"}}
            {{> plainPart data=data label="Inscription"
                field="https://artresearch.net/resource/field_definition/pharos_model/inscription"}}
            {{> plainPart data=data label="Provenance"
                field="https://artresearch.net/resource/field_definition/pharos_model/work_provenance"}}
            {{> plainPart data=data label="Exhibitions"
                field="https://artresearch.net/resource/field_definition/pharos_model/exhibitions"}}
            {{> plainPart data=data label="Bibliography"
                field="https://artresearch.net/resource/field_definition/pharos_model/bibliography"}}

            {{> sourcesPart data=data subject=subject}}
          </div>
        </section>

      </div>
    </div>
  </template>

  <!-- ───────────────────────────────────────────────────────────────
       The marks: who said this. Never a control.
       ─────────────────────────────────────────────────────────────── -->

  <template id="mark">
    <i class="mark{{#if sm}} mark--sm{{/if}}{{#unless archive.icon}} mark--letter{{/unless}}" data-archive="{{archive.key}}" title="{{archive.label}}">{{#unless archive.icon}}{{initial archive.label}}{{/unless}}</i>
  </template>

  <template id="marks">
    {{#each providers}}{{> mark archive=this sm=../sm}}{{/each}}
  </template>

  <!-- The authority behind a term: the name to the record, the badge to the authority -->
  <template id="badge">
    {{#if (authorityCode iri)}}<a href="/resource/?uri={{encodeUriComponent iri}}" class="auth" title="{{authorityName iri}}">{{authorityCode iri}}</a>{{/if}}
  </template>

  <!-- ───────────────────────────────────────────────────────────────
       A claim: lozenge · text · kind · marks register · edge column
       ─────────────────────────────────────────────────────────────── -->

  <template id="claim">
    <div class="claim claim--{{claimKind value}}" data-arch="{{archKeys value}}">
      <span class="text">{{#if link}}<a href="/resource/?uri={{encodeUriComponent link}}">{{text}}</a>{{> badge iri=link}}{{else}}{{text}}{{/if}}</span>
      <span class="kind">{{kind}}</span>
      <span class="marks">{{> marks providers=(providers value deep=true)}}</span>
    </div>
  </template>

  <!-- A claim with the slip of what the archives wrote beneath it; the
       handle appears only when there is evidence to pull out. -->
  <template id="claimWithSlip">
    {{#with (evidence value originals)}}
    <details>
      <summary>{{> claim value=../value text=(claimLabel ../value ../originals) link=../value.[@id]}}</summary>
      <div class="slip">
        {{#each this}}
        <div class="evidence" data-arch="{{archKeys this}}">
          <span class="text"><q>{{label}}</q></span>
          <span class="kind">as recorded</span>
          <span class="marks">{{> marks providers=providers sm=true}}</span>
        </div>
        {{/each}}
      </div>
    </details>
    {{else}}
    {{> claim value=value text=(claimLabel value originals) link=value.[@id]}}
    {{/with}}
  </template>

  <!-- A narrower term hanging beneath its claim -->
  <template id="branch">
    <div class="branch" data-arch="{{archKeys value}}">
      <span class="text">{{#if value.[@id]}}<a href="/resource/?uri={{encodeUriComponent value.[@id]}}">{{claimLabel value originals}}</a>{{> badge iri=value.[@id]}}{{else}}{{claimLabel value originals}}{{/if}}</span>
      <span class="marks">{{> marks providers=(providers value deep=true) sm=true}}</span>
    </div>
  </template>

  <!-- ───────────────────────────────────────────────────────────────
       The head
       ─────────────────────────────────────────────────────────────── -->

  <template id="gloss">
    {{#each (gloss data)}}{{#unless @first}} · {{/unless}}{{#if href}}<a href="{{href}}">{{text}}</a>{{else}}{{text}}{{/if}}{{#if note}}, <em>{{note}}</em>{{/if}}{{/each}}
  </template>

  <!-- ───────────────────────────────────────────────────────────────
       The parts, in the curators' order and under their names
       ─────────────────────────────────────────────────────────────── -->

  <!-- Title: the three titles the archives agree on most, the others folded
       away beneath them under a handle like a claim's slip -->
  <template id="titlePart">
    {{#with (rankByAgreement data.[https://artresearch.net/resource/field_definition/pharos_model/title].values keep=3)}}
    {{#if shown}}
    <div class="part">
      <h2>Title</h2>
      <div class="group">
        {{#each shown}}{{> titleClaim value=this}}{{/each}}
        {{#if rest}}
        <details class="more">
          <summary>
            <div class="claim claim--more" data-arch="{{archKeys rest}}">
              <span class="text"><span class="closed">Show {{rest.length}} more titles</span><span class="opened">Show fewer titles</span></span>
              <span class="marks">{{> marks providers=(providers rest) sm=true}}</span>
            </div>
          </summary>
          {{#each rest}}{{> titleClaim value=this}}{{/each}}
        </details>
        {{/if}}
      </div>
    </div>
    {{/if}}
    {{/with}}
  </template>

  <template id="titleClaim">
    <div class="claim claim--{{claimKind value}}" data-arch="{{archKeys value}}">
      <span class="text">{{#if value.label}}{{value.label}}{{else}}{{value.[@value]}}{{/if}}</span>
      <span class="kind">{{#with (fieldLabel value "https://artresearch.net/resource/field_definition/pharos_model/p2")}}{{humanize this}}{{/with}}</span>
      <span class="marks">{{> marks providers=value.providers}}</span>
    </div>
  </template>

  <!-- Creator/Attribution: creators and other production participants are one
       list of reconciled artists. Each is one claim (the name linked, its
       authority badge, the attribution type only when an archive recorded one),
       with the names as the archives wrote them in the slip beneath. -->
  <template id="attributionPart">
    {{#if (or data.[https://artresearch.net/resource/field_definition/pharos_model/creator]
              data.[https://artresearch.net/resource/field_definition/pharos_model/participant])}}
    <div class="part">
      <h2>Creator/Attribution</h2>
      {{#each data.[https://artresearch.net/resource/field_definition/pharos_model/creator].values}}
      {{> attributionGroup value=this open=@first}}
      {{/each}}
      {{#each data.[https://artresearch.net/resource/field_definition/pharos_model/participant].values}}
      {{#unless (find ../data.[https://artresearch.net/resource/field_definition/pharos_model/creator].values (concat "(eq item.[@id] '" [@id] "')"))}}
      {{> attributionGroup value=this}}
      {{/unless}}
      {{/each}}
    </div>
    {{/if}}
  </template>

  <template id="attributionGroup">
    <div class="group">
      {{#with (evidence value "https://artresearch.net/resource/field_definition/pharos_model/original_value_creator")}}
      <details open="{{#if ../open}}open{{/if}}">
        <summary>{{> claim value=../value text=../value.label link=../value.[@id] kind=(fieldLabel ../value "https://artresearch.net/resource/field_definition/pharos_model/creator_attribution_types")}}</summary>
        <div class="slip">
          {{#each this}}
          <div class="evidence" data-arch="{{archKeys this}}">
            <span class="text"><q>{{label}}</q>{{#with (fieldLabel this "https://artresearch.net/resource/field_definition/pharos_model/creator_attribution_types")}} <small>— {{this}}</small>{{/with}}{{#with (fieldLabel this "https://artresearch.net/resource/field_definition/pharos_model/creator_role")}} <small>— {{this}}</small>{{/with}}</span>
            <span class="kind">as recorded</span>
            <span class="marks">{{> marks providers=providers sm=true}}</span>
          </div>
          {{/each}}
        </div>
      </details>
      {{else}}
      {{> claim value=value text=value.label link=value.[@id] kind=(fieldLabel value "https://artresearch.net/resource/field_definition/pharos_model/creator_attribution_types")}}
      {{/with}}
    </div>
  </template>

  <!-- Production Date: every archive's reading on one scale -->
  <template id="datePart">
    {{#with data.[https://artresearch.net/resource/field_definition/pharos_model/production_date]}}
    <div class="part">
      <h2>Production Date</h2>
      {{#with (dateChart (mergeByLabel values))}}
      <div class="scale">
        {{#each rows}}
        <div class="scale-row" data-arch="{{#each providers}}{{#unless @first}} {{/unless}}{{key}}{{/each}}">
          <span class="read">{{label}}</span>
          <span class="groove">{{#if dated}}<span class="ink" style="left:{{left}}%;width:{{width}}%"></span><span class="pt" style="left:{{center}}%"></span>{{/if}}</span>
          <span class="kind">{{qualifier}}</span>
          <span class="marks">{{> marks providers=providers sm=true}}</span>
        </div>
        {{/each}}
        <div class="scale-foot">{{#each ticks}}<span class="{{#if bound}}bound{{/if}}" style="left:{{left}}%">{{year}}</span>{{/each}}</div>
      </div>
      {{else}}
      {{#each (mergeByLabel values)}}
      <div class="line" data-arch="{{archKeys this}}">
        <span class="text">{{#if label}}{{label}}{{else}}{{[@value]}}{{/if}}</span>
        <span class="kind">{{fieldLabel this "https://artresearch.net/resource/field_definition/pharos_model/production_date_qualifier"}}</span>
        <span class="marks">{{> marks providers=providers sm=true}}</span>
      </div>
      {{/each}}
      {{/with}}
    </div>
    {{/with}}
  </template>

  <!-- Repository/Last Known Location: the keeper, as each archive names it,
       and the place beneath it -->
  <template id="locationPart">
    {{#if (or data.[https://artresearch.net/resource/field_definition/pharos_model/current_keeper]
              data.[https://artresearch.net/resource/field_definition/pharos_model/last_known_location])}}
    <div class="part">
      <h2>Repository/Last Known Location</h2>
      <div class="group">
        {{#each (mergeByLabel data.[https://artresearch.net/resource/field_definition/pharos_model/current_keeper].values)}}
        {{> claimWithSlip value=this originals="https://artresearch.net/resource/field_definition/pharos_model/original_value"}}
        {{/each}}
        {{#with data.[https://artresearch.net/resource/field_definition/pharos_model/last_known_location].values}}
        <div class="branch" data-arch="{{archKeys this}}">
          <span class="text">{{#each this}}{{#unless @first}}<span class="sep">·</span>{{/unless}}{{#if [@id]}}<a href="/resource/?uri={{encodeUriComponent [@id]}}">{{label}}</a>{{else}}{{label}}{{/if}}{{/each}}{{> badge iri=this.[0].[@id]}}</span>
          <span class="marks">{{> marks providers=(providers this deep=true) sm=true}}</span>
        </div>
        {{/with}}
      </div>
    </div>
    {{/if}}
  </template>

  <!-- Subjects: terms gathered under the Iconclass division they belong to,
       laid in a row; the space between them is the separator -->
  <template id="subjectPart">
    {{#with data.[https://artresearch.net/resource/field_definition/pharos_model/subject]}}
    <div class="part">
      <h2>Subjects</h2>
      {{#each (umbrellaGroups values "https://artresearch.net/resource/field_definition/pharos_model/subject_umbrella")}}
      <div class="group">
        {{#if umbrella}}
        <h3 class="umbrella" title="{{umbrella.label}}"><a href="/resource/?uri={{encodeUriComponent umbrella.[@id]}}">{{umbrella.label}}</a>{{> badge iri=umbrella.[@id]}}</h3>
        {{/if}}
        <div class="run">{{#each items}}<span data-arch="{{archKeys this}}">{{#if [@id]}}<a href="/resource/?uri={{encodeUriComponent [@id]}}">{{label}}</a>{{else}}{{label}}{{/if}}<span class="marks">{{> marks providers=providers sm=true}}</span></span>{{/each}}</div>
      </div>
      {{/each}}
    </div>
    {{/with}}
  </template>

  <!-- Physical Properties: types, material, technique; narrower terms hang
       beneath the term they belong to -->
  <template id="physicalPart">
    {{#if (or data.[https://artresearch.net/resource/field_definition/pharos_model/type]
              data.[https://artresearch.net/resource/field_definition/pharos_model/material]
              data.[https://artresearch.net/resource/field_definition/pharos_model/technique])}}
    <div class="part">
      <h2>Physical Properties</h2>
      {{> treeGroup data=data label="Types" field="https://artresearch.net/resource/field_definition/pharos_model/type"}}
      {{> treeGroup data=data label="Material" field="https://artresearch.net/resource/field_definition/pharos_model/material"}}
      {{> treeGroup data=data label="Technique" field="https://artresearch.net/resource/field_definition/pharos_model/technique"}}
    </div>
    {{/if}}
  </template>

  <template id="treeGroup">
    {{#with (lookup data field)}}
    <div class="group">
      <h3 class="field">{{../label}}</h3>
      {{#each (treeGroups values "https://artresearch.net/resource/field_definition/pharos_model/type_hierarchy_parent")}}
      {{> claimWithSlip value=root originals="https://artresearch.net/resource/field_definition/pharos_model/original_value"}}
      {{#each children}}
      {{> branch value=this originals="https://artresearch.net/resource/field_definition/pharos_model/original_value"}}
      {{/each}}
      {{/each}}
    </div>
    {{/with}}
  </template>

  <!-- A field with no reconciliation layer: one line per value, with its marks -->
  <template id="plainPart">
    {{#with (lookup data field)}}
    <div class="part">
      <h2>{{../label}}</h2>
      {{#each (mergeByLabel values)}}
      <div class="line" data-arch="{{archKeys this}}">
        <span class="text">{{#if label}}{{label}}{{else}}{{[@value]}}{{/if}}</span>
        <span class="marks">{{> marks providers=providers sm=true}}</span>
      </div>
      {{/each}}
    </div>
    {{/with}}
  </template>

  <!-- Every contributing catalogue, linked to its own record -->
  <template id="sourcesPart">
    {{#if data.[https://artresearch.net/resource/field_definition/pharos_model/catalog_record_url]}}
    <div class="part sources">
      <h2>View original records</h2>
      {{#each (sortByArchive data.[https://artresearch.net/resource/field_definition/pharos_model/catalog_record_url].values)}}
      {{#with (lookup (providers this) 0)}}
      <a href="{{../label}}" target="_blank" rel="noopener noreferrer" data-arch="{{key}}"
        title="{{#if ../[https://artresearch.net/resource/field_definition/pharos_model/original_record_title].values.[0].[@value]}}{{../[https://artresearch.net/resource/field_definition/pharos_model/original_record_title].values.[0].[@value]}}{{else}}{{label}}{{/if}}"><span class="text">{{label}}</span><span class="kind id">{{../[https://artresearch.net/resource/field_definition/pharos_model/original_record_identifier].values.[0].[@value]}}</span><span class="marks">{{> mark archive=this sm=true}}</span></a>
      {{/with}}
      {{/each}}
      <div class="colophon">PHAROS record {{shortId subject}} · artresearch.net · <a href="mailto:info@artresearch.net" title="Contact us">contact us</a> · <semantic-link iri="https://artresearch.net/resource/TermsAndConditions" target="_blank">terms of use</semantic-link></div>
    </div>
    {{/if}}
  </template>

</resource-info>
