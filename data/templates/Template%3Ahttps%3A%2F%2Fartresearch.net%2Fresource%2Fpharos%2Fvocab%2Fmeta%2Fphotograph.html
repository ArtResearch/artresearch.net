<resource-info subject="[[this]]" profile="photograph-full" template="{{> template}}">

  <!-- ═══════════════════════════════════════════════════════════════
       PHAROS photograph page: the reading room, for one photograph.
       Implements platform-design/pharos-photograph.md. The bench on the
       left is the pharos-auto-fit-grid: its Photograph tab lays the
       photograph under the light (pharos-photo-light: its leaves, full
       resolution when asked, download), its Similar photographs tab the
       photographs the vector indices find like it. The sheet on the right
       is the photograph's record, as its one archive wrote it.
       Styles: assets/new-styles/reading-room.css.
       ═══════════════════════════════════════════════════════════════ -->
  <template id="template">
    <mp-event-trigger id="breadcrumbs" type='Component.TemplateUpdate' on='["mounted"]'
      targets='["top-header-breadcrumbs"]' data='{"breadcrumb": "Photograph: {{escapeForJson (photoTitle data)}}"}'>
    </mp-event-trigger>

    <div class="rr rr--photograph">
      <div class="desk">

        <!-- ═════════ the bench: rail above, the photograph under the light ═════════ -->
        <section class="bench">
          <pharos-auto-fit-grid class="table" layout-algo="justified"
            tabs='[{"key":"photograph","label":"Photograph"},{"key":"similar","label":"Similar photographs"}]'
            images='[]'
            photo-card='{"profile": "photograph-glance", "title": "https://artresearch.net/resource/field_definition/pharos_model/photo_title",
              "fields": ["https://artresearch.net/resource/field_definition/pharos_model/photographer", "https://artresearch.net/resource/field_definition/pharos_model/photo_shot_date", "https://artresearch.net/resource/field_definition/pharos_model/photo_process"]}'>

            <div data-tab="photograph" class="light-tab">
              <pharos-photo-light image='{{photoImage data base="https://artresearch.net"
                workLabel=data.[https://artresearch.net/resource/field_definition/pharos_model/photo_artwork].values.[0].label}}'></pharos-photo-light>
            </div>

            <!--
              Photographs like this one, from the QLever vector indices: near-identical copies
              (DINOv3, those that stand out from the score distribution) and visually similar ones
              (SigLIP 2), fused by rank. Each lies as itself, a photograph (?photo), titled by the
              work it shows.
            -->
            <div data-tab="similar" data-empty="No similar photographs were found." data-query='
              PREFIX vec: <https://qlever.cs.uni-freiburg.de/vectorSearch/>
              PREFIX rank: <https://qlever.cs.uni-freiburg.de/rank/>
              PREFIX custom: <https://artresearch.net/custom/>
              PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
              PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
              SELECT ?subject ?photo ?image ?iiif ?width ?height ?archive ?provider ?logo ?note (SAMPLE(?workLabel) AS ?label) WHERE {
                {
                  SELECT ?subject (SUM(1.0 / (60 + ?rank)) AS ?score) (GROUP_CONCAT(?matchedModel ; separator=" · ") AS ?note) WHERE {
                    {
                      SERVICE rank: {
                        _:dinov3 rank:score ?distance ; rank:descending false ; rank:bindRank ?rank .
                        {
                          SELECT ?subject ?distance WHERE {
                            SERVICE vec: {
                              [] vec:index "dinov3" ; vec:query <{{subject}}> ;
                                 vec:result ?subject ; vec:bindScore ?distance ;
                                 vec:autoCut "precise" ; vec:k 100 .
                            }
                            FILTER(?subject != <{{subject}}>)
                          }
                        }
                      }
                      BIND("near-identical" AS ?matchedModel)
                    } UNION {
                      SERVICE rank: {
                        _:images rank:score ?distance ; rank:descending false ; rank:bindRank ?rank .
                        {
                          SELECT ?subject ?distance WHERE {
                            SERVICE vec: {
                              [] vec:index "images" ; vec:fullPrecision true ; vec:query <{{subject}}> ;
                                 vec:result ?subject ; vec:bindScore ?distance ; vec:k 50 .
                            }
                            FILTER(?subject != <{{subject}}>)
                          }
                        }
                      }
                      BIND("visual similarity" AS ?matchedModel)
                    }
                  }
                  GROUP BY ?subject
                }
                ?subject custom:primary_image ?img .
                ?img custom:preview_url ?preview .
                OPTIONAL { ?img custom:iiif_url ?iiif . }
                OPTIONAL { ?img custom:image_width ?width . }
                OPTIONAL { ?img custom:image_height ?height . }
                OPTIONAL { ?subject crm:P49_has_former_or_current_keeper ?provider . }
                OPTIONAL { ?subject crm:P65_shows_visual_item ?visual . ?visual crm:P138_represents ?work . ?work rdfs:label ?workLabel . }
                BIND(?subject AS ?photo)
                BIND(REPLACE(STR(?provider), "^.*/", "") AS ?archive)
                BIND(IF(STRSTARTS(?preview, "http"), ?preview, CONCAT("https://artresearch.net", ?preview)) AS ?image)
                BIND(CONCAT("/assets/images/minilogo_", ?archive, ".png") AS ?logo)
              }
              GROUP BY ?subject ?photo ?image ?iiif ?width ?height ?archive ?provider ?logo ?note ?score
              ORDER BY DESC(?score) DESC(?subject)
              LIMIT 100
            '></div>
          </pharos-auto-fit-grid>
          <div class="bench-note">
            <span class="for-photos"><b>Press</b> the photograph to view it at full resolution.</span>
            <span class="for-photos"><b>Download</b> it at the sizes its archive gives.</span>
            <span class="for-works"><b>Pick up</b> a photograph to see it under the light.</span>
            <span class="for-works"><b>Lay out</b> the mounts to read what each says.</span>
          </div>
        </section>

        <!-- ═════════ the photograph's record ═════════ -->
        <section class="record">
          <div class="sheet">
            {{#with data.[https://artresearch.net/resource/field_definition/pharos_model/photo_provider].values.[0]}}
            <div class="through">
              <span class="through-lead">Photograph in</span>
              <span class="who who--all">{{#with [https://artresearch.net/resource/field_definition/pharos_model/provider_icon].values.[0]}}<img class="mark-img" src="{{[@value]}}" alt="">{{/with}}{{label}}</span>
            </div>
            {{/with}}

            <header class="head">
              <h1>{{photoTitle data}}</h1>
              {{#with (photoRows data "photographer photo_shot_date")}}
              <p class="gloss">{{#each this}}{{#if @index}} · {{/if}}{{#each values}}{{#if @index}}, {{/if}}{{label}}{{/each}}{{/each}}</p>
              {{/with}}
              {{#with data.[https://artresearch.net/resource/field_definition/pharos_model/photo_identifier].values}}
              <div class="imprint">{{#each this}}{{#if @index}} · {{/if}}<span class="id">{{label}}</span>{{/each}}</div>
              {{/with}}
            </header>

            {{#with (photoCitation data workLabel=data.[https://artresearch.net/resource/field_definition/pharos_model/photo_artwork].values.[0].label)}}
            <div class="part cite">
              <h2>Cite as</h2>
              <p class="cite-text">{{this}}</p>
            </div>
            {{/with}}

            {{#with data.[https://artresearch.net/resource/field_definition/pharos_model/photo_artwork]}}
            <div class="part shows">
              <h2>{{label}}</h2>
              {{#each values}}
              <div class="line">
                <span class="text"><a href="/resource/?uri={{encodeUriComponent [@id]}}">{{label}}</a></span>
                <span class="marks"><a class="open-key" href="/resource/?uri={{encodeUriComponent [@id]}}" target="_blank" rel="noopener noreferrer">Open record</a></span>
              </div>
              {{/each}}
            </div>
            {{/with}}

            {{> group data=data label="Photographic Object" fields="photo_object_type photo_format photo_colour photo_material photo_size photo_mount_size photo_process photo_made photo_issuer photo_negative photo_numbers photo_stamp photo_holding photo_owner photo_condition photo_feature photo_credit_line photo_note"}}
            {{> group data=data label="Photograph" fields="photo_view photo_view_description photographer photo_shot_date photo_campaign photo_commission"}}
            {{> group data=data label="Acquisition" fields="photo_acquisition photo_loan"}}
            {{> group data=data label="Digital Image" fields="photo_digitiser photo_digitised photo_digitisation_project"}}
            {{> group data=data label="Rights" fields="photo_license photo_rights_holder"}}

            <div class="part sources">
              <h2>Sources</h2>
              {{#each data.[https://artresearch.net/resource/field_definition/pharos_model/catalog_record_url].values}}
              <a href="{{label}}" target="_blank" rel="noopener noreferrer"><span class="text">The archive's own record</span></a>
              {{/each}}
              <div class="colophon">PHAROS photograph {{shortId subject}} · artresearch.net ·
                {{#with data.[https://artresearch.net/resource/field_definition/pharos_model/photo_provider].values.[0].[https://artresearch.net/resource/field_definition/pharos_model/photo_provider_contact].values.[0]}}<a href="{{[@value]}}?subject=[artresearch.net]">contact the institution</a> ·{{/with}}
                <semantic-link iri="https://artresearch.net/resource/TermsAndConditions" target="_blank">terms of use</semantic-link></div>
            </div>
          </div>
        </section>

      </div>
    </div>
  </template>

  <!-- ───────────────────────────────────────────────────────────────
       One part of the photograph's record: its fields as label and
       value, in the order given; left out when the record says nothing
       in it.
       ─────────────────────────────────────────────────────────────── -->
  <template id="group">
    {{#with (photoRows data fields)}}
    <div class="part">
      <h2>{{../label}}</h2>
      <dl class="rows">
        {{#each this}}
        <div class="field-row">
          <dt>{{label}}</dt>
          <dd>{{#each values}}{{#if @index}}<span class="sep"> · </span>{{/if}}{{#if href}}<a href="{{href}}" target="_blank" rel="noopener noreferrer">{{label}}</a>{{else}}{{label}}{{/if}}{{/each}}</dd>
        </div>
        {{/each}}
      </dl>
    </div>
    {{/with}}
  </template>

</resource-info>
